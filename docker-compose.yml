services:
  neo4j:
    image: neo4j:5-community
    container_name: movielens-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/movielens32m
      # Comfortable defaults for a laptop. For the full 32M graph, raise heap
      # and page cache (for example 4G and 4G) if Docker has the memory.
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_db_memory_transaction_total_max: 1G
      NEO4J_db_transaction_timeout: 90s
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p movielens32m 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

volumes:
  neo4j_data:
